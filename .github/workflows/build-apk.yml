# Builds the Cycle Saathi app file (APK) on GitHub's free build machines.
#
# How to use it (no PC power needed):
#   1. On GitHub open the repo, then the "Actions" tab.
#   2. Pick "Build app file (APK)" on the left, then "Run workflow", then the green button.
#   3. Wait about 10-20 minutes. Open the finished run and download "CycleSaathi-apk" at the bottom.
#      (The download is a .zip with the .apk inside.)
#
# It also runs by itself when this file changes, which checks that the setup still works.
name: Build app file (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android build tools this app needs
        working-directory: .
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install packages
        run: npm ci --legacy-peer-deps

      - name: Prepare the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Remember Gradle downloads between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build the app file
        working-directory: app/android
        run: ./gradlew app:assembleRelease -x lint -x test --no-daemon

      - name: Name the file and report its size
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/*.apk "../dist/CycleSaathi-v${VERSION}.apk"
          SIZE_MB=$(du -m "../dist/CycleSaathi-v${VERSION}.apk" | cut -f1)
          echo "::notice title=App file size::CycleSaathi-v${VERSION}.apk is about ${SIZE_MB} MB"
          echo "### CycleSaathi-v${VERSION}.apk is about ${SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the app file for download
        uses: actions/upload-artifact@v4
        with:
          name: CycleSaathi-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
